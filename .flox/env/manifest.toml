schema-version = "1.13.0"

[install]
bun.pkg-path = "bun"
bun.version = "1.3.13"
# Wrangler / Vite tooling expects a Node toolchain on PATH.
nodejs.pkg-path = "nodejs"
nodejs.version = "24.16.0"
# Quick tunnels for local GitHub webhook delivery (`bun run dev`).
cloudflared.pkg-path = "cloudflared"
cloudflared.version = "2026.6.1"

[vars]
SHUTTLE_WORKER_PORT = "8790"
SHUTTLE_WEB_PORT = "5180"

[hook]
on-activate = '''
  echo "Shuttle"
  echo "  bun install"
  echo "  cp apps/worker/.dev.vars.example apps/worker/.dev.vars"
  echo "  bun run dev   # worker :$SHUTTLE_WORKER_PORT + web :$SHUTTLE_WEB_PORT (+ webhook tunnel when GitHub App is set)"
'''

[profile]
common = '''
  :
'''

[options]
# systems left default
