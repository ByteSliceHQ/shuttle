<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The macOS app icon: the Shuttle mark on an 824pt tile, inset on a 1024pt canvas. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a292e"/>
      <stop offset="1" stop-color="#141316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="2"/>
  <g transform="translate(224 224) scale(12)">
    <g fill="#f2efe9"><rect x="11.5" y="5" width="9" height="20.5" rx="2.25"/><rect x="11.5" y="38.5" width="9" height="4.5" rx="2.25"/><rect x="27.5" y="5" width="9" height="4.5" rx="2.25"/><rect x="27.5" y="22.5" width="9" height="20.5" rx="2.25"/></g>
    <g fill="#5db2f7"><rect x="5" y="11.5" width="4.5" height="9" rx="2.25"/><rect x="22.5" y="11.5" width="20.5" height="9" rx="2.25"/><rect x="5" y="27.5" width="20.5" height="9" rx="2.25"/><rect x="38.5" y="27.5" width="4.5" height="9" rx="2.25"/></g>
  </g>
</svg>
